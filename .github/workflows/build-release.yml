name: Build and Publish Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload (for example v1.0.2)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Show build outputs
        run: ls -lah build/libs

      - name: Upload JAR to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name 'squatshield-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "No release JAR found in build/libs"
            exit 1
          fi
          echo "Uploading $JAR to release $TAG"
          gh release upload "$TAG" "$JAR" --clobber
