plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Terraformers"
        url = uri("https://maven.terraformersmc.com/")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories { }
}

tasks.register("generateModIcon") {
    def output = layout.buildDirectory.file("generated/resources/main/assets/squatshield/icon.png")
    outputs.file(output)
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        System.setProperty("java.awt.headless", "true")
        def image = new java.awt.image.BufferedImage(128, 128, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def g = image.createGraphics()
        g.setRenderingHint(java.awt.RenderingHints.KEY_TEXT_ANTIALIASING, java.awt.RenderingHints.VALUE_TEXT_ANTIALIAS_ON)
        g.setColor(new java.awt.Color(10, 10, 12))
        g.fillRect(0, 0, 128, 128)
        g.setColor(new java.awt.Color(75, 78, 84))
        g.fillRoundRect(8, 18, 112, 92, 12, 12)
        g.setColor(new java.awt.Color(118, 75, 40))
        int[] sx = [64, 101, 94, 64, 34, 27]
        int[] sy = [28, 39, 87, 105, 87, 39]
        g.fillPolygon(sx, sy, 6)
        g.setColor(new java.awt.Color(205, 183, 150))
        g.setStroke(new java.awt.BasicStroke(3f))
        g.drawPolygon(sx, sy, 6)
        g.setFont(new java.awt.Font("SansSerif", java.awt.Font.BOLD, 18))
        g.setColor(java.awt.Color.WHITE)
        g.drawString("Squat", 10, 68)
        g.setColor(new java.awt.Color(214, 146, 73))
        g.drawString("Shield", 60, 68)
        g.dispose()
        javax.imageio.ImageIO.write(image, "png", target)
    }
}
processResources.dependsOn(tasks.named("generateModIcon"))
sourceSets.main.resources.srcDir(layout.buildDirectory.dir("generated/resources/main"))
